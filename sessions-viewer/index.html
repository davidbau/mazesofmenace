<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session Viewer — Teleport Coding Challenge</title>
<link rel="stylesheet" href="style.css">
<!-- Shim Node built-ins so contestant forks that import 'fs' / 'path' /
     'module' (etc.) don't fail at the browser's module resolver before
     any of their browser-safe code can run. The shim throws a clearer
     error from the call site if the contestant actually invokes one
     of these — see /shim/node-builtins.mjs. -->
<script type="importmap">
{
    "imports": {
        "module":           "/shim/node-builtins.mjs",
        "node:module":      "/shim/node-builtins.mjs",
        "fs":               "/shim/node-builtins.mjs",
        "node:fs":          "/shim/node-builtins.mjs",
        "fs/promises":      "/shim/node-builtins.mjs",
        "node:fs/promises": "/shim/node-builtins.mjs",
        "path":             "/shim/node-builtins.mjs",
        "node:path":        "/shim/node-builtins.mjs",
        "url":              "/shim/node-builtins.mjs",
        "node:url":         "/shim/node-builtins.mjs",
        "os":               "/shim/node-builtins.mjs",
        "node:os":          "/shim/node-builtins.mjs",
        "process":          "/shim/node-builtins.mjs",
        "node:process":     "/shim/node-builtins.mjs"
    }
}
</script>
<script>
// Browser stub for the Node `process` global. `process` is a Node
// runtime *global*, not an importable module — when contestant code
// reads `process.cwd()`, `process.env`, etc. at module-init, no
// importmap can save it. Define a minimal shim before any module
// loads so the import phase finishes; calls that need a real Node
// runtime throw a clearer error from their call site.
(function () {
    if (typeof globalThis.process !== 'undefined') return;
    const fail = (name) => () => {
        throw new Error(name + ' was called in the browser; this fork uses Node-only APIs');
    };
    globalThis.process = {
        env:      {},
        argv:     [],
        platform: 'browser',
        version:  'browser',
        versions: { node: '0.0.0' },
        cwd:      () => '/',
        nextTick: (fn, ...a) => Promise.resolve().then(() => fn(...a)),
        stdout:   { write: (s) => console.log(String(s)) },
        stderr:   { write: (s) => console.error(String(s)) },
        exit:     fail('process.exit()'),
        kill:     fail('process.kill()'),
        chdir:    fail('process.chdir()'),
    };
    // Don't shim Buffer / __dirname / __filename — leaving them
    // undefined keeps `typeof Buffer === 'undefined'` guards working
    // correctly. Code that reads them unguarded will fail at the
    // use site, which is the right outcome.
})();
</script>
</head>
<body>
<header>
    <div class="title">
        <h1 id="page-title">Session Viewer</h1>
        <span class="hint"><span class="nowrap">Screen divergence</span> &mdash; <span class="nowrap">scrub the timeline, watch the map</span></span>
        <span class="fork-context" id="fork-context"></span>
    </div>
    <div class="picker">
        <select id="session-select">
            <option value="">Pick a session…</option>
        </select>
        <label class="file-picker">
            <input type="file" id="session-file" accept=".json">
            <span class="nowrap">or load file…</span>
        </label>
    </div>
</header>

<section id="status">Pick a session to begin.</section>

<section id="timeline-pane">
    <div id="timeline-wrap">
        <canvas id="timeline" width="2400" height="130"></canvas>
        <div class="row-labels">
            <span class="row-label canon">canon</span>
            <span class="row-label js">js</span>
            <span class="row-label screen">screen</span>
        </div>
    </div>
    <div class="timeline-meta">
        <span class="legend">
            <span class="legend-group">
                <span class="legend-item"><span class="swatch sw-match"></span> match</span>
                <span class="legend-item"><span class="swatch sw-diff"></span> value diff</span>
                <span class="legend-item"><span class="swatch sw-canon-only"></span> canon-only call</span>
                <span class="legend-item"><span class="swatch sw-js-only"></span> js-only call</span>
            </span>
            <span class="legend-sep"></span>
            <span class="legend-group">
                <span class="legend-item"><span class="swatch ch-missing"></span> missing char</span>
                <span class="legend-item"><span class="swatch ch-wrong"></span> wrong char</span>
                <span class="legend-item"><span class="swatch attr-diff"></span> attr wrong</span>
                <span class="legend-item"><span class="swatch cursor-diff"></span> cursor wrong</span>
            </span>
        </span>
        <span id="step-readout">step 0 / 0</span>
    </div>
</section>

<main>
    <div id="map-pane">
        <div class="map-pane-inner">
            <div class="map-header">
                <span id="step-key" class="step-key">—</span>
                <div class="view-modes" id="view-modes">
                    <button data-view="canon">canon</button>
                    <button data-view="js" class="active">js</button>
                    <button data-view="diff">diff</button>
                </div>
            </div>
            <pre id="map-grid"><!-- 24×80 cells injected here --></pre>
        </div>
    </div>
    <aside id="detail-pane" aria-hidden="true">
        <div class="detail-pane-head">
            <div class="detail-label">details</div>
            <button type="button" id="close-detail" class="toggle-btn" aria-label="Close details">×</button>
        </div>
        <div class="detail-block">
            <div class="detail-label">cursor</div>
            <div id="cursor-detail">—</div>
        </div>
        <div class="detail-block">
            <div class="detail-label">message line</div>
            <div id="msg-detail">—</div>
        </div>
        <div class="detail-block detail-block-rng">
            <div class="detail-label">prng (this step)</div>
            <div id="rng-detail">—</div>
        </div>
    </aside>
</main>

<!-- Edge handle: tab on the right side of the viewport that toggles
     the details fly-out open. The fly-out shows cursor + message-line
     + the per-step PRNG diff (canon vs JS), all in one place. Hidden
     when the fly-out is open (its × is the close affordance). -->
<button type="button" id="open-detail" class="edge-handle" title="Show cursor, message-line, and per-step PRNG diff" aria-label="Show details">
    <span class="edge-handle-glyph">‹</span>
</button>
<div id="detail-scrim" hidden></div>

<script type="module" src="viz.mjs"></script>
</body>
</html>
